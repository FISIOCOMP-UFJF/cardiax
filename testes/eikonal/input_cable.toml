# ============================================================
#  Eikonal solver input
# ============================================================

[problem]
model = "eikonal"
mesh  = "cable_10x_fiber.xml"

# ------------------------------------------------------------
#  Physical: default conduction velocities.
#  NOTE: the mesh <eikonal vel_f=.. vel_s=.. vel_n=..> overrides these.
# ------------------------------------------------------------
[physical]
conductivity_type = "M_ISOTROPIC" 

vel_f = 1.0          
vel_s = 1.0
vel_n = 1.0

# ------------------------------------------------------------
#  Activation source:
# ------------------------------------------------------------
[activation]
source = "inline"  

[[activation.root]]
id   = 0
time = 0.0

# add more sites freely
# [[activation.root]]
# id   = 512
# time = 5.0

# ------------------------------------------------------------
#  Output
# ------------------------------------------------------------
[output]
filename = "eikonal_sample_output"   # init() builds this from the mesh prefix
write_lat = true                      # HDF5/XDMF + eikonal.txt dump
