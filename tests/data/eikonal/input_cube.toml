# ============================================================
#  Eikonal solver input
# ============================================================

[problem]
model = "eikonal"
mesh  = "cube.xml"

# ------------------------------------------------------------
#  Physical
# ------------------------------------------------------------
[physical]
conductivity_type = "M_ISOTROPIC" 

vel_f = 1.0          
vel_s = 1.0
vel_n = 1.0

# ------------------------------------------------------------
#  Activation source
# ------------------------------------------------------------
[activation]
source = "inline"  

[[activation.root]]
id   = 0
time = 0.0

# add more sites freely
# [[activation.root]]
# id   = 512
# time = 5.0

# ------------------------------------------------------------
#  Output
# ------------------------------------------------------------
[output]
filename = "eikonal_cube_output"   
write_lat = true                   
